<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>STRIL-60 | Tactical Station</title>
    <style>
        body { margin: 0; background-color: #010000; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Courier New', monospace; }
        #console-container { display: flex; align-items: center; gap: 60px; }
        #monitor-wrap { position: relative; border: 35px solid #1a1a1a; border-radius: 50%; padding: 0; box-shadow: 0 0 100px #ff330015; width: 800px; height: 800px; background: #000; }
        canvas { background-color: #030200; border-radius: 50%; filter: brightness(1.7) contrast(2.8) blur(0.5px); cursor: crosshair; }
        #dial-container { text-align: center; color: #ff3300; letter-spacing: 2px; font-size: 10px; user-select: none; }
        #knob { width: 80px; height: 80px; background: #111; border: 4px solid #331100; border-radius: 50%; position: relative; cursor: grab; margin-bottom: 10px; box-shadow: inset 0 0 15px #000, 0 5px 15px #000; }
        #knob::after { content: ''; position: absolute; top: 10%; left: 50%; width: 4px; height: 30%; background: #ff3300; transform: translateX(-50%); border-radius: 2px; box-shadow: 0 0 8px #ff3300; }
        .dial-label { margin-top: 10px; font-weight: bold; border-top: 1px solid #331100; padding-top: 5px; }
    </style>
</head>
<body>

    <div id="console-container">
        <div id="monitor-wrap">
            <canvas id="radarCanvas"></canvas>
        </div>
        <div id="dial-container">
            <div id="knob"></div>
            <div class="dial-label">MASTER GAIN</div>
            <div id="gain-readout" style="color:#ffcc00; font-size:14px; margin-top:5px;">85%</div>
        </div>
    </div>

<script>
const canvas = document.getElementById('radarCanvas');
const ctx = canvas.getContext('2d');
const SIZE = 800;
const CENTER = SIZE / 2;
const RADIUS = SIZE * 0.48;
const ORANGE = (alpha) => `rgba(255, 110, 0, ${alpha})`; 

canvas.width = SIZE;
canvas.height = SIZE;

let angle = 0;
let zoomLevel = 1.0, offsetX = 0, offsetY = 0, radarGain = 0.85;
let rasterY = SIZE + 50, mapAlpha = 0;
const planes = [];

const swedenCoast = [
    {x: 0.05, y: 0.50}, {x: 0.10, y: 0.60}, {x: 0.12, y: 0.75}, {x: 0.15, y: 0.85},
    {x: 0.20, y: 0.95}, {x: 0.35, y: 0.98}, {x: 0.45, y: 0.90},
    {x: 0.50, y: 0.80}, {x: 0.55, y: 0.65}, {x: 0.65, y: 0.40}, {x: 0.75, y: 0.20}
];

const fogPoints = [];
for(let i=0; i<1500; i++) fogPoints.push({ x: Math.random()*2400-1200, y: Math.random()*2400-1200, s: Math.random()*4 });

for (let i = 0; i < 5; i++) {
    planes.push({
        x: Math.random() * SIZE, y: Math.random() * SIZE,
        vx: (Math.random()-0.5)*0.2, vy: (Math.random()-0.5)*0.2,
        lastSeen: 0, isSelected: false, hookX: 0, hookY: 0, hookAlpha: 0, id: `TRK-${100 + i}`
    });
}

const knob = document.getElementById('knob');
let isDragging = false, currentDeg = 306; 
knob.style.transform = `rotate(${currentDeg}deg)`;

knob.addEventListener('mousedown', () => isDragging = true);
window.addEventListener('mouseup', () => isDragging = false);
window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const rect = knob.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2, centerY = rect.top + rect.height / 2;
    const angleRad = Math.atan2(e.clientY - centerY, e.clientX - centerX);
    let newDeg = (angleRad * (180 / Math.PI)) + 90;
    if (newDeg < 0) newDeg += 360;
    let diff = newDeg - currentDeg;
    if (Math.abs(diff) > 180) diff += (diff > 0 ? -360 : 360);
    const potentialDeg = currentDeg + diff;
    if (potentialDeg >= 0 && potentialDeg <= 360) {
        currentDeg = potentialDeg;
        knob.style.transform = `rotate(${currentDeg}deg)`;
        radarGain = (currentDeg / 360);
        document.getElementById('gain-readout').innerText = Math.round(radarGain * 100) + "%";
    }
});

function getDist(x1, y1, x2, y2) { return Math.sqrt((x2-x1)**2 + (y2-y1)**2); }
function getScreenPos(worldX, worldY) {
    return { x: (worldX - CENTER + offsetX) * zoomLevel + CENTER, y: (worldY - CENTER + offsetY) * zoomLevel + CENTER };
}

canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    let found = false;
    planes.forEach(p => {
        const pos = getScreenPos(p.x, p.y);
        if (getDist(pos.x, pos.y, CENTER, CENTER) < RADIUS && getDist(mx, my, pos.x, pos.y) < 30) {
            planes.forEach(o => o.isSelected = false);
            p.isSelected = true; p.hookAlpha = 1.0; found = true;
        }
    });
    if (!found) planes.forEach(o => o.isSelected = false);
});

window.addEventListener('wheel', (e) => { offsetX -= (e.deltaX / zoomLevel); offsetY -= (e.deltaY / zoomLevel); });
window.addEventListener('keydown', (e) => {
    const step = 40 / zoomLevel;
    if (e.key === ".") zoomLevel *= 1.1;
    if (e.key === "-" || e.key === ",") zoomLevel /= 1.1;
    if (e.key === "ArrowUp") offsetY += step; if (e.key === "ArrowDown") offsetY -= step;
    if (e.key === "ArrowLeft") offsetX += step; if (e.key === "ArrowRight") offsetX -= step;
});

function draw() {
    // --- NOISE FLICKER ENGINE ---
    // Occasional power spikes (1 in 200 frames)
    const powerSpike = Math.random() > 0.995 ? 0.4 : 0;
    // Continuous micro-instability
    const jitter = (Math.random() - 0.5) * 0.05;
    const activeGain = Math.max(0, radarGain + jitter + powerSpike);

    ctx.fillStyle = `rgba(0, 0, 0, ${0.15 - (powerSpike/4)})`; 
    ctx.fillRect(0, 0, SIZE, SIZE);

    const station = getScreenPos(CENTER, CENTER);
    const lastAngle = angle;
    angle += 0.022;

    if (((lastAngle + Math.PI/2) % (Math.PI * 2)) > ((angle + Math.PI/2) % (Math.PI * 2))) {
        rasterY = 0; mapAlpha = 1.0;
    }

    // DRAW MAP
    if (mapAlpha > 0.01) {
        ctx.lineWidth = 2.5;
        swedenCoast.forEach((p, i) => {
            const pos = getScreenPos(p.x * SIZE, p.y * SIZE);
            if (pos.y < rasterY || rasterY >= SIZE) {
                ctx.strokeStyle = ORANGE(mapAlpha * (0.4 + powerSpike));
                ctx.beginPath();
                const prev = swedenCoast[i-1];
                if (prev) {
                    const prevPos = getScreenPos(prev.x * SIZE, prev.y * SIZE);
                    ctx.moveTo(prevPos.x, prevPos.y); ctx.lineTo(pos.x, pos.y); ctx.stroke();
                }
            }
        });
        mapAlpha *= 0.975; 
    }

    // RASTER GLOW TRAIL
    if (rasterY < SIZE) {
        ctx.shadowBlur = 20 + (powerSpike * 50);
        ctx.shadowColor = ORANGE(1);
        ctx.strokeStyle = ORANGE(0.8 + powerSpike);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(CENTER - RADIUS, rasterY); ctx.lineTo(CENTER + RADIUS, rasterY);
        ctx.stroke();
        
        let grad = ctx.createLinearGradient(0, rasterY - 60, 0, rasterY);
        grad.addColorStop(0, ORANGE(0));
        grad.addColorStop(1, ORANGE(0.25 + powerSpike/2));
        ctx.fillStyle = grad;
        ctx.fillRect(CENTER - RADIUS, rasterY - 60, RADIUS * 2, 60);

        rasterY += 140; ctx.shadowBlur = 0;
    }

    // NOISE / CLUTTER
    ctx.fillStyle = ORANGE(0.85 * activeGain);
    const clutterDensity = 2000 * activeGain;
    for (let i = 0; i < clutterDensity; i++) {
        const d = Math.pow(Math.random(), 2.1) * (550 * zoomLevel);
        const a = Math.random() * Math.PI * 2;
        const nx = station.x + d * Math.cos(a), ny = station.y + d * Math.sin(a);
        if (getDist(nx, ny, CENTER, CENTER) < RADIUS && d > 12 * zoomLevel) {
            ctx.fillRect(nx, ny, 1 + Math.random() * 2, 1 + Math.random() * 2);
        }
    }

    // BEAM
    ctx.save();
    ctx.shadowBlur = 25 + (powerSpike * 40);
    ctx.globalAlpha = 0.6 + powerSpike;
    ctx.shadowColor = ORANGE(1.0);
    ctx.strokeStyle = ORANGE(1.0);
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(station.x, station.y);
    ctx.lineTo(station.x + Math.cos(angle) * (SIZE * 5), station.y + Math.sin(angle) * (SIZE * 5));
    ctx.stroke();
    ctx.restore();

    planes.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        const pos = getScreenPos(p.x, p.y);
        const distToRadar = getDist(pos.x, pos.y, station.x, station.y);
        if (getDist(pos.x, pos.y, CENTER, CENTER) < RADIUS) {
            const pAngle = Math.atan2(pos.y - station.y, pos.x - station.x);
            const sweepA = angle % (Math.PI * 2);
            if (Math.abs(sweepA - pAngle) < 0.06) {
                p.lastSeen = 1.0;
                if (p.isSelected) { p.hookX = pos.x; p.hookY = pos.y; p.hookAlpha = 1.0; }
            }
            if (p.lastSeen > 0) {
                const signalStrength = Math.max(0.0, 1.0 - (distToRadar / (RADIUS * 0.9)));
                if (signalStrength > 0.05) {
                    ctx.save();
                    ctx.shadowBlur = 15 * signalStrength; ctx.shadowColor = ORANGE(1.0);
                    ctx.fillStyle = ORANGE(p.lastSeen * activeGain * 1.5 * signalStrength);
                    ctx.beginPath(); ctx.arc(pos.x, pos.y, 3 * signalStrength + 1, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                }
                p.lastSeen -= 0.005;
            }
        }
        if (p.isSelected && p.hookAlpha > 0) {
            ctx.save();
            ctx.strokeStyle = ORANGE(p.hookAlpha + (powerSpike * 0.5));
            ctx.lineWidth = 1;
            const s = 16;
            ctx.beginPath();
            ctx.moveTo(p.hookX, p.hookY - s); ctx.lineTo(p.hookX + s, p.hookY + s*0.7); ctx.lineTo(p.hookX - s, p.hookY + s*0.7);
            ctx.closePath(); ctx.stroke();
            ctx.restore();
            p.hookAlpha -= 0.002;
        }
    });

    // MASK
    ctx.strokeStyle = '#010000'; ctx.lineWidth = 250;
    ctx.beginPath(); ctx.arc(CENTER, CENTER, RADIUS + 125, 0, Math.PI * 2); ctx.stroke();
    requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
